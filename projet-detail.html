<!DOCTYPE html>
<html lang="en" data-mode="jour">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projet — Charlotte Froidefond</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

.detail-page { padding-bottom: 120px; }

/* Navigation desktop : flèche retour + projet-tabs, pas de nav standard */
.nav-links { display: none; }

/* Tabs centrés — colonnes symétriques pour aligner avec detail-wrap */
.nav { grid-template-columns: 1fr auto 1fr; }
.projet-tabs-inner { transform: none; }

@media (min-width: 1800px) {
  .nav { padding-left: clamp(80px, 11vw, 300px); padding-right: clamp(80px, 11vw, 300px); }
}
@media (min-width: 1600px) and (max-width: 1799px) {
  .nav { padding-left: clamp(60px, 8vw, 180px); padding-right: clamp(60px, 8vw, 180px); }
}

.nav-back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(19,17,43,0.82);
  border: 0.5px solid rgba(255,255,255,0.15);
  color: #fff;
  text-decoration: none;
  flex-shrink: 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: background 0.2s;
}
.nav-back-btn:hover { background: rgba(40,28,80,0.9); }
.nav-back-btn .material-icons-round { font-size: 18px; }

/* Mobile : la flèche retour est dans .proj-mob-nav, inutile ici */
@media (max-width: 680px) {
  .nav-back-btn { display: none; }
}

/* Tabs projets — col 2 du nav grid desktop, masqués sur mobile */
.projet-tabs-inner {
  grid-column: 2;
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(13, 11, 30, 0.66);
  border: 0.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 5px;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  overflow-x: auto;
  scrollbar-width: none;
}
.projet-tabs-inner::-webkit-scrollbar { display: none; }

@media (max-width: 680px) {
  .projet-tabs-inner { display: none; }
}

/* Chaque tab */
.tab-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 20px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.38);
  text-decoration: none;
  white-space: nowrap;
  transition: color 0.2s, background 0.2s;
  flex-shrink: 0;
}

.tab-pill:hover { color: rgba(255, 255, 255, 0.72); }

.tab-pill.active {
  background: var(--purple);
  color: #fff;
}

/* Numéro italic */
.tab-num {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.28);
  line-height: 1;
}

.tab-pill.active .tab-num { color: rgba(255, 255, 255, 0.65); }

.detail-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 20px 28px 0;
}

.detail-card {
  background: rgba(13,11,30,0.66);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 20px;
  padding: 40px 44px 44px;
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
}

.detail-footer-note {
  text-align: center;
  font-size: 14px;
  font-style: italic;
  color: var(--text-muted);
  margin-top: 32px;
  opacity: 0.6;
}

.client-tag {
  display: inline-block;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  margin-bottom: 20px;
}

.detail-titre {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.15;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 14px;
}

.detail-titre .hl { color: var(--purple-light); }

.detail-sous-titre {
  font-size: 16px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 28px;
}

.detail-sep {
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin: 28px 0;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
}

.meta-cell {
  padding: 14px 0 14px 0;
  border-right: 1px solid rgba(255,255,255,0.07);
  padding-right: 20px;
  padding-left: 4px;
}

.meta-cell:first-child { padding-left: 0; }
.meta-cell:last-child { border-right: none; padding-right: 0; }
.meta-cell:nth-child(4) { border-right: none; padding-right: 0; }
.meta-cell:nth-child(5) { padding-left: 0; }
.meta-cell:nth-child(n+5) { border-top: 1px solid rgba(255,255,255,0.07); padding-top: 16px; }

.meta-cell:nth-child(8) { border-right: none; }

.meta-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--purple-light);
  margin-bottom: 6px;
}

.meta-value {
  font-size: 15px;
  font-weight: 300;
  color: var(--text);
  line-height: 1.5;
}

.meta-statut {
  display: flex;
  align-items: center;
  gap: 7px;
}

.statut-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--purple);
  flex-shrink: 0;
}

.section-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--purple-light);
  margin-bottom: 12px;
}

.section-text {
  font-size: 16px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.8;
}

.steps-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.step-item {
  display: flex;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  align-items: baseline;
}

.step-item:last-child { border-bottom: none; }

.step-bullet {
  color: var(--purple);
  font-size: 20px;
  line-height: 1;
  flex-shrink: 0;
  margin-top: 1px;
}

.step-body { font-size: 15px; font-weight: 300; color: var(--text-muted); line-height: 1.7; }
.step-name { font-weight: 600; color: var(--text); }
.step-em { color: rgba(255,255,255,0.4); margin: 0 5px; }

.defi-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.defi-card {
  background: rgba(123,58,237,0.06);
  border-left: 2px solid var(--purple);
  border-radius: 0 12px 12px 0;
  padding: 20px 24px;
}

.defi-num {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  color: var(--purple-light);
  font-size: 15px;
  margin-bottom: 6px;
}

.defi-titre {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.4;
}

.defi-desc {
  font-size: 15px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.7;
}

.defi-sep {
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin: 14px 0;
}

.defi-solution {
  display: flex;
  gap: 10px;
  font-size: 15px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.7;
  align-items: flex-start;
}

.defi-arrow {
  color: var(--purple-light);
  font-weight: 600;
  flex-shrink: 0;
}

.kpis-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.kpi-card {
  background: rgba(123,58,237,0.08);
  border: 1px solid rgba(123,58,237,0.18);
  border-radius: 14px;
  padding: 22px 20px;
  text-align: center;
}

.kpi-titre {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 400;
  color: var(--purple-light);
  line-height: 1.1;
  margin-bottom: 10px;
}

.kpi-desc {
  font-size: 14px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.6;
}

.competences-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* ── Gallery ─────────────────────────────────── */
.gallery { display: flex; flex-direction: column; gap: 8px; }
.gallery-img {
  width: 100%; height: auto; display: block;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.07);
}
.gallery-top {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 8px;
}
.gallery-mobile-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.07);
}
.gallery-mobile-wrap > img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}
.gallery-strip    { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gallery-2col     { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gallery-2col > .gallery-img {
  aspect-ratio: 16 / 10;
  object-fit: cover;
  object-position: top left;
}
.gallery-right-col { display: flex; flex-direction: column; gap: 8px; }

/* ── Animated frame (crossfade loop) ─────────── */
@keyframes frame-cycle {
  0%   { opacity: 0; }
  5%   { opacity: 1; }
  25%  { opacity: 1; }
  30%  { opacity: 0; }
  100% { opacity: 0; }
}

.anim-frame {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.07);
}
.anim-frame img {
  display: block;
  width: 100%; height: auto;
  animation: frame-cycle 12s linear infinite;
  animation-fill-mode: backwards;
}
.anim-frame img:not(:first-child) {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: top;
}
.anim-frame img:nth-child(1) { animation-delay: 0s; }
.anim-frame img:nth-child(2) { animation-delay: 3s; }
.anim-frame img:nth-child(3) { animation-delay: 6s; }
.anim-frame img:nth-child(4) { animation-delay: 9s; }

@media (prefers-reduced-motion: reduce) {
  .anim-frame img { animation: none; opacity: 1; }
  .anim-frame img:not(:first-child) { display: none; }
}

@media (max-width: 700px) {
  .projet-tabs { gap: 4px; padding: 8px 12px; overflow-x: auto; justify-content: flex-start; }
  .meta-grid { grid-template-columns: repeat(2, 1fr); }
  .meta-cell:nth-child(2) { border-right: none; }
  .meta-cell:nth-child(4) { border-right: none; }
  .meta-cell:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,0.07); padding-top: 14px; }
  .meta-cell:nth-child(n+5) { border-top: 1px solid rgba(255,255,255,0.07); }
  .kpis-grid { grid-template-columns: 1fr; }
  .detail-card { padding: 24px 20px 28px; }
  .detail-wrap { padding: 20px 14px 0; }
}

/* ── Navigation mobile — projets ─────────────────────── */
.proj-mob-nav { display: none; }

@media (max-width: 680px) {
  /* La nav standard et les tabs desktop laissent place à la nav projet */
  .nav-links   { display: none; }
  .projet-tabs { display: none; }

  .proj-mob-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .proj-mob-back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(19,17,43,0.82);
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #fff;
    text-decoration: none;
    flex-shrink: 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: background 0.2s;
  }
  .proj-mob-back:hover { background: rgba(40,28,80,0.9); }
  .proj-mob-back .material-icons-round { font-size: 18px; }

  .proj-mob-pages {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--navy-80);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 4px;
    gap: 2px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    min-width: 0;
    overflow: hidden;
  }

  .proj-mob-prev,
  .proj-mob-next {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 5px 8px;
    border-radius: var(--radius-pill);
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color 0.2s, background 0.2s;
  }
  .proj-mob-prev:hover:not(:disabled),
  .proj-mob-next:hover:not(:disabled) { color: #fff; background: rgba(255,255,255,0.07); }
  .proj-mob-prev:disabled,
  .proj-mob-next:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .proj-mob-prev .material-icons-round,
  .proj-mob-next .material-icons-round { font-size: 16px; }

  .proj-mob-label {
    flex: 1;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 5px 8px;
    background: var(--purple);
    border-radius: var(--radius-pill);
    min-width: 0;
  }
}

</style>
</head>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let currentId = parseInt(new URLSearchParams(location.search).get('id'), 10) || 1;

  // ── Tabs — générés une seule fois ────────────────
  const tabsEl = document.getElementById('projet-tabs');
  tabsEl.innerHTML = PROJETS.map(p =>
    `<a href="?id=${p.id}" class="tab-pill" data-id="${p.id}">
      <span class="tab-num">${p.num}</span><span data-en="${p.en?.titreCourt || p.titreCourt}" data-fr="${p.titreCourt}">${p.titreCourt}</span>
    </a>`
  ).join('');

  // ── Rendu initial (pas d'animation — page-in CSS s'en charge) ──
  render(currentId);
  setActiveTab(currentId);
  updateMobileNav(currentId);

  // ── Interception des clics sur les tabs ──────────
  tabsEl.addEventListener('click', e => {
    const tab = e.target.closest('[data-id]');
    if (!tab) return;
    e.preventDefault();
    const newId = parseInt(tab.dataset.id);
    if (newId === currentId) return;
    history.pushState({ id: newId }, '', `?id=${newId}`);
    navigate(newId);
  });

  // ── Boutons précédent / suivant du navigateur ────
  window.addEventListener('popstate', e => {
    navigate(e.state?.id || 1, false);
  });

  // ────────────────────────────────────────────────
  function navigate(id, animate = true) {
    currentId = id;
    setActiveTab(id);
    updateMobileNav(id);
    const card = document.getElementById('detail-content');
    if (animate) {
      card.style.transition = 'opacity 0.14s ease';
      card.style.opacity = '0';
      setTimeout(() => {
        render(id);
        card.style.opacity = '1';
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, 140);
    } else {
      render(id);
    }
  }

  function setActiveTab(id) {
    tabsEl.querySelectorAll('[data-id]').forEach(t =>
      t.classList.toggle('active', parseInt(t.dataset.id) === id)
    );
  }

  function render(id) {
    const projet = PROJETS.find(p => p.id === id);
    if (!projet) { location.href = 'projets.html'; return; }

    const lang = document.documentElement.lang || 'en';
    const t = (lang === 'en' && projet.en) ? { ...projet, ...projet.en } : projet;

    document.title = `${projet.num} — ${t.titreCourt} · Charlotte Froidefond`;

    const titreSurligné = t.titre
      .split(t.highlight)
      .join(`<span class="hl">${t.highlight}</span>`);

    const roleCourt = t.role.split(' (')[0];

    const demarche = t.demarche.map(s =>
      `<li class="step-item">
        <span class="step-bullet">·</span>
        <span class="step-body"><span class="step-name">${s.titre}</span><span class="step-em"> — </span>${s.desc}</span>
      </li>`
    ).join('');

    const defis = t.defis.map((d, i) =>
      `<div class="defi-card">
        <div class="defi-num" data-en="Challenge 0${i + 1}" data-fr="Défi 0${i + 1}">Défi 0${i + 1}</div>
        <div class="defi-titre">${d.titre}</div>
        <div class="defi-desc">${d.desc}</div>
        <div class="defi-sep"></div>
        <div class="defi-solution">
          <span class="defi-arrow">→</span>
          <span>${d.solution}</span>
        </div>
      </div>`
    ).join('');

    const kpis = t.kpis.map(k =>
      `<div class="kpi-card">
        <div class="kpi-titre">${k.titre}</div>
        <div class="kpi-desc">${k.desc}</div>
      </div>`
    ).join('');

    const competences = t.competences.map(c =>
      `<span class="tag">${c}</span>`
    ).join('');

    const gallery = (() => {
      const imgs = projet.images;
      if (!imgs || !imgs.length) return '';
      const toImg = i => {
        if (i.type === 'animated') {
          return `<div class="anim-frame">${i.frames.map(f => `<img src="${f}" alt="${i.alt}">`).join('')}</div>`;
        }
        if (i.type === 'mobile') {
          return `<div class="gallery-mobile-wrap"><img src="${i.src}" alt="${i.alt}"></div>`;
        }
        return `<img class="gallery-img" src="${i.src}" alt="${i.alt}">`;
      };
      let inner;
      if (imgs[0].type === 'mobile' && imgs.length >= 2) {
        const right = imgs.slice(1).map(toImg).join('');
        inner = `<div class="gallery-top">${toImg(imgs[0])}<div class="gallery-right-col">${right}</div></div>`;
      } else if (imgs[0].type === 'full') {
        const rest = imgs.slice(1);
        inner = toImg(imgs[0]) +
          (rest.length ? `<div class="gallery-2col">${rest.map(toImg).join('')}</div>` : '');
      } else {
        inner = `<div class="gallery-2col">${imgs.map(toImg).join('')}</div>`;
      }
      return `<div class="detail-sep"></div><div class="section-label" data-en="Preview" data-fr="Aperçu">Aperçu</div><div class="gallery">${inner}</div>`;
    })();

    const detailEl = document.getElementById('detail-content');
    detailEl.innerHTML = `
      <span class="client-tag">${projet.clientCourt}</span>
      <h1 class="detail-titre">${titreSurligné}</h1>
      <p class="detail-sous-titre">${t.sousTitreCourt}</p>
      <div class="detail-sep"></div>

      <div class="meta-grid">
        <div class="meta-cell"><div class="meta-label" data-en="Client" data-fr="Client">Client</div><div class="meta-value">${projet.clientCourt}</div></div>
        <div class="meta-cell"><div class="meta-label" data-en="Year" data-fr="Année">Année</div><div class="meta-value">${projet.annee}</div></div>
        <div class="meta-cell"><div class="meta-label" data-en="Role" data-fr="Rôle">Rôle</div><div class="meta-value">${roleCourt}</div></div>
        <div class="meta-cell"><div class="meta-label" data-en="Team" data-fr="Équipe">Équipe</div><div class="meta-value">${projet.equipe}</div></div>
        <div class="meta-cell"><div class="meta-label" data-en="Tools" data-fr="Outils">Outils</div><div class="meta-value">${projet.outils.join(' · ')}</div></div>
        <div class="meta-cell"><div class="meta-label" data-en="Duration" data-fr="Durée">Durée</div><div class="meta-value">${t.dureeCourte}</div></div>
        <div class="meta-cell"><div class="meta-label" data-en="Status" data-fr="Statut">Statut</div><div class="meta-value meta-statut"><span class="statut-dot"></span>${t.statut}</div></div>
        <div class="meta-cell"></div>
      </div>

      <div class="detail-sep"></div>
      <div class="section-label" data-en="Context &amp; challenges" data-fr="Contexte &amp; enjeux">Contexte &amp; enjeux</div>
      <p class="section-text">${t.contexte}</p>

      ${gallery}

      <div class="detail-sep"></div>
      <div class="section-label" data-en="UX/UI Approach" data-fr="Démarche UX/UI">Démarche UX/UI</div>
      <ul class="steps-list">${demarche}</ul>

      <div class="detail-sep"></div>
      <div class="section-label" data-en="Challenges &amp; solutions" data-fr="Défis &amp; solutions">Défis &amp; solutions</div>
      <div class="defi-list">${defis}</div>

      <div class="detail-sep"></div>
      <div class="section-label" data-en="Results &amp; KPIs" data-fr="Résultats &amp; KPIs">Résultats &amp; KPIs</div>
      <div class="kpis-grid">${kpis}</div>

      <div class="detail-sep"></div>
      <div class="section-label" data-en="Skills involved" data-fr="Compétences mobilisées">Compétences mobilisées</div>
      <div class="competences-wrap">${competences}</div>
    `;
    applyLang(document.documentElement.lang || 'en');
  }

  // ── Navigation mobile entre projets ─────────────────
  function updateMobileNav(id) {
    const idx      = PROJETS.findIndex(p => p.id === id);
    const prev     = idx > 0 ? PROJETS[idx - 1] : null;
    const next     = idx < PROJETS.length - 1 ? PROJETS[idx + 1] : null;
    const current  = PROJETS[idx];

    const labelEl  = document.getElementById('proj-mob-label');
    const prevBtn  = document.getElementById('proj-mob-prev');
    const nextBtn  = document.getElementById('proj-mob-next');
    const prevNum  = document.getElementById('proj-mob-prev-num');
    const nextNum  = document.getElementById('proj-mob-next-num');

    const lang = document.documentElement.lang || 'en';
    const titre = lang === 'en' ? (current.en?.titreCourt || current.titreCourt) : current.titreCourt;
    if (labelEl) labelEl.textContent = `${current.num} · ${titre}`;
    if (prevNum) prevNum.textContent = prev ? prev.num : '';
    if (nextNum) nextNum.textContent = next ? next.num : '';

    if (prevBtn) {
      prevBtn.disabled = !prev;
      prevBtn.onclick  = prev ? () => {
        history.pushState({ id: prev.id }, '', `?id=${prev.id}`);
        navigate(prev.id);
      } : null;
    }
    if (nextBtn) {
      nextBtn.disabled = !next;
      nextBtn.onclick  = next ? () => {
        history.pushState({ id: next.id }, '', `?id=${next.id}`);
        navigate(next.id);
      } : null;
    }
  }

  // ── Re-render au changement de langue ───────────────
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => render(currentId));
  });

  // ── Nav toggle mobile ────────────────────────────────
  const modeToggle  = document.querySelector('.nav-mode-toggle');
  const navControls = document.querySelector('.nav-controls');
  if (modeToggle && navControls) {
    modeToggle.addEventListener('click', e => {
      e.stopPropagation();
      const open = navControls.classList.toggle('open');
      modeToggle.setAttribute('aria-expanded', String(open));
    });
    navControls.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => {
      navControls.classList.remove('open');
      modeToggle.setAttribute('aria-expanded', 'false');
    });
  }
});
</script>
</body>
</html>
