<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projet — Charlotte Froidefond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

/* ══════════════════════════════════════════════════════════
   V2 — Design tokens (identiques à index-v2.html)
   ══════════════════════════════════════════════════════════ */
:root {
  --v2-bg:              #1C0E3F;
  --v2-card:             rgba(15, 20, 42, 0.82);
  --v2-tint:             rgba(99, 1, 199, 0.22);
  --v2-line:             rgba(255, 255, 255, 0.12);
  --v2-line-soft:        rgba(255, 255, 255, 0.08);
  --v2-fg:               #FFFFFF;
  --v2-fg-soft:          #EDEDED;
  --v2-fg-muted:         rgba(255, 255, 255, 0.68);
  --v2-accent:           #A370FF;
  --v2-title:            #DBB7FF;
  --v2-ring:             rgba(255, 255, 255, 0.07);
  --v2-glow:             rgba(163, 112, 255, 0.38);
  --v2-input-bg:         rgba(255, 255, 255, 0.06);
  --v2-input-border:     rgba(255, 255, 255, 0.15);
  --v2-input-placeholder: rgba(255, 255, 255, 0.25);
  --v2-shadow:           rgba(0, 0, 0, 0.20);
  --v2-nav-overlay:      rgba(15, 20, 42, 0.55);
}

html[data-theme="light"] {
  --v2-bg:              #F6F3FC;
  --v2-card:             #FFFFFF;
  --v2-tint:             rgba(123, 58, 237, 0.06);
  --v2-line:             rgba(28, 14, 63, 0.10);
  --v2-line-soft:        rgba(28, 14, 63, 0.08);
  --v2-fg:               #1C0E3F;
  --v2-fg-soft:          rgba(28, 14, 63, 0.72);
  --v2-fg-muted:         rgba(28, 14, 63, 0.55);
  --v2-accent:           #7B3AED;
  --v2-title:            #7B3AED;
  --v2-ring:             rgba(123, 58, 237, 0.14);
  --v2-glow:             rgba(163, 112, 255, 0.30);
  --v2-input-bg:         rgba(28, 14, 63, 0.04);
  --v2-input-border:     rgba(28, 14, 63, 0.14);
  --v2-input-placeholder: rgba(28, 14, 63, 0.35);
  --v2-shadow:           rgba(60, 20, 120, 0.10);
  --v2-nav-overlay:      rgba(255, 255, 255, 0.7);
}

* { box-sizing: border-box; }

body {
  background: var(--v2-bg);
  color: var(--v2-fg);
  transition: background 0.4s ease, color 0.4s ease;
  font-family: 'DM Sans', sans-serif;
}

.bg-layer { display: none; }

.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
}

.detail-page { padding-bottom: 120px; }

/* ══ Bannière projet ═══════════════════════════════════
   Toutes les sources n'ont pas la même définition. Quand un recadrage
   plein cadre obligerait à agrandir l'image (et donc à la rendre floue),
   le script bascule en mode « net » : l'image garde sa taille, une copie
   floutée comble les côtés.                                            */
.detail-banner {
  position: relative;
  width: 100%;
  height: clamp(220px, 32vw, 420px);
  overflow: hidden;
  background: var(--v2-bg);
}
.detail-banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#detail-banner-img { position: relative; z-index: 1; }

.detail-banner-fond {
  position: absolute;
  inset: 0;
  filter: blur(30px);
  transform: scale(1.15);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.detail-banner--net .detail-banner-fond { opacity: 1; }
.detail-banner--net #detail-banner-img { object-fit: contain; }

/* ══ Navigation ══════════════════════════════════════ */
.nav-links { display: none; }

.v2-detail-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px clamp(20px, 4vw, 64px);
  background: var(--v2-nav-overlay);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.v2-close-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  color: var(--v2-fg-muted);
  text-decoration: none;
  flex-shrink: 0;
  border-radius: 50%;
  transition: color 0.2s, background 0.2s;
}
.v2-close-btn:hover { color: var(--v2-fg); background: var(--v2-input-bg); }
.v2-close-btn .material-icons-round { font-size: 28px; }

.v2-nav-right { display: flex; align-items: center; gap: 22px; }
.v2-nav-right .lang-btn { color: var(--v2-fg-muted); }
.v2-nav-right .lang-btn.active { color: var(--v2-accent); }
.v2-nav-right .lang-btn:hover { color: var(--v2-fg); }
.v2-nav-right .lang-sep { background: var(--v2-line); }

.v2-theme-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--v2-input-bg);
  border-radius: 999px;
  padding: 5px;
}
.v2-theme-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid transparent;
  background: transparent;
  color: var(--v2-fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.v2-theme-btn .material-icons-round { font-size: 16px; }
.v2-theme-btn:hover { color: var(--v2-fg); }
.v2-theme-btn.active {
  border-color: var(--v2-accent);
  color: var(--v2-fg);
  background: var(--v2-card);
  box-shadow: inset 0 4px 16px rgba(123,58,237,0.20);
}

@media (max-width: 500px) {
  .v2-detail-nav { padding: 16px 20px; }
}

/* ══ Contenu détail ══════════════════════════════════ */
.detail-wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 28px 0;
}

.detail-titre {
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.2;
  color: var(--v2-accent);
  margin-bottom: 14px;
}

.detail-sous-titre {
  font-size: clamp(16px, 1.6vw, 20px);
  font-weight: 300;
  color: var(--v2-fg);
  line-height: 1.6;
  margin-bottom: 8px;
}

.detail-sep {
  height: 1px;
  background: var(--v2-line-soft);
  margin: 32px 0;
}

.meta-block {
  border-top: 1px solid var(--v2-line);
  border-bottom: 1px solid var(--v2-line);
  padding: 28px 0;
  margin: 32px 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  row-gap: 24px;
  column-gap: 20px;
}

.meta-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--v2-accent);
  margin-bottom: 8px;
}

.meta-value {
  font-size: 15px;
  font-weight: 400;
  color: var(--v2-fg);
  line-height: 1.5;
}

.meta-statut { display: flex; align-items: center; gap: 8px; }
.statut-dot {
  width: 8px; height: 8px;
  border-radius: 3px;
  background: var(--v2-accent);
  box-shadow: 0 0 8px var(--v2-accent);
  flex-shrink: 0;
}

@media (max-width: 700px) {
  .meta-block { grid-template-columns: repeat(2, 1fr); row-gap: 20px; }
}

.section-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--v2-accent);
  margin-bottom: 14px;
}

.section-text {
  font-size: 16px;
  font-weight: 300;
  color: var(--v2-fg-soft);
  line-height: 1.8;
}

.steps-list { list-style: none; display: flex; flex-direction: column; gap: 20px; }

.step-item {
  font-size: 16px;
  font-weight: 300;
  color: var(--v2-fg-soft);
  line-height: 1.7;
}
.step-name { font-weight: 600; color: var(--v2-fg); }
.step-dot { color: var(--v2-accent); font-weight: 700; margin: 0 8px; }

.defi-list { display: flex; flex-direction: column; gap: 16px; }

.defi-card {
  background: var(--v2-card);
  border: 1px solid var(--v2-accent);
  border-left-width: 3px;
  border-radius: 14px;
  padding: 24px 28px;
  box-shadow: 0 4px 30px var(--v2-shadow);
}

.defi-num {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  color: var(--v2-accent);
  font-size: 14px;
  margin-bottom: 8px;
}

.defi-titre { font-size: 18px; font-weight: 600; color: var(--v2-fg); margin-bottom: 8px; line-height: 1.4; }
.defi-desc { font-size: 14px; font-weight: 300; color: var(--v2-fg-muted); line-height: 1.6; }
.defi-sep { border-top: 1px dashed var(--v2-line); margin: 18px 0; }

.defi-solution {
  display: flex;
  gap: 8px;
  font-size: 14px;
  font-weight: 300;
  color: var(--v2-fg-soft);
  line-height: 1.7;
  align-items: flex-start;
}
.defi-arrow { color: var(--v2-accent); font-weight: 700; flex-shrink: 0; }

.kpis-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.kpi-card {
  background: var(--v2-card);
  border: 1px solid var(--v2-line);
  border-radius: 14px;
  padding: 24px 22px;
  box-shadow: 0 4px 30px var(--v2-shadow);
}

.kpi-titre {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: clamp(24px, 3vw, 30px);
  font-weight: 400;
  color: var(--v2-accent);
  line-height: 1.1;
  margin-bottom: 10px;
}
.kpi-desc { font-size: 14px; font-weight: 300; color: var(--v2-fg-muted); line-height: 1.6; }

@media (max-width: 700px) { .kpis-grid { grid-template-columns: 1fr; } }

.competences-wrap { display: flex; flex-wrap: wrap; gap: 10px; }

.competences-wrap .tag {
  display: inline-flex;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--v2-tint);
  border: 0.5px solid var(--v2-line);
  color: var(--v2-accent);
  white-space: nowrap;
}

/* ══ Objectifs ═══════════════════════════════════════ */
.objectifs-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.objectifs-list li {
  position: relative;
  padding-left: 26px;
  font-size: 16px;
  font-weight: 300;
  color: var(--v2-fg-soft);
  line-height: 1.7;
}
.objectifs-list li::before {
  content: '→';
  position: absolute;
  left: 0;
  top: 0;
  color: var(--v2-accent);
  font-weight: 700;
}

/* ══ Enjeux — encart ═════════════════════════════════ */
.enjeux-block {
  background: var(--v2-tint);
  border-left: 3px solid var(--v2-accent);
  border-radius: 0 14px 14px 0;
  padding: 22px 26px;
  font-size: 16px;
  font-weight: 300;
  color: var(--v2-fg-soft);
  line-height: 1.8;
}

/* ══ Méthodologie ════════════════════════════════════ */
.methodo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.methodo-card {
  background: var(--v2-card);
  border: 1px solid var(--v2-line);
  border-radius: 14px;
  padding: 24px 26px;
  box-shadow: 0 4px 30px var(--v2-shadow);
}
.methodo-titre {
  font-size: 17px;
  font-weight: 600;
  color: var(--v2-fg);
  margin-bottom: 14px;
}
.methodo-card ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.methodo-card li {
  position: relative;
  padding-left: 18px;
  font-size: 14px;
  font-weight: 300;
  color: var(--v2-fg-muted);
  line-height: 1.6;
}
.methodo-card li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--v2-accent);
}

/* ══ Galerie visuels ═════════════════════════════════
   Grille de 12 colonnes : chaque visuel occupe une largeur adaptée à son
   format (portrait = quart de largeur, panoramique = pleine largeur), ce
   qui évite les grandes marges vides autour des images verticales.       */
.gallery {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-flow: row dense;
  align-items: start;
  gap: 18px;
}
.shot {
  grid-column: span 6;          /* défaut : demi-largeur */
  margin: 0;
  border: 1px solid var(--v2-line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--v2-card);
  box-shadow: 0 4px 30px var(--v2-shadow);
}

.shot--narrow { grid-column: span 3; }   /* portrait : 4 par ligne */
.shot--third  { grid-column: span 4; }   /* planche d'écrans : 3 par ligne */
.shot--full   { grid-column: 1 / -1; }   /* panoramique ou mockup mis en avant */
.shot img {
  display: block;
  width: 100%;
  height: auto;
}

/* `ratio` dans les données : le visuel est recadré à un format imposé, ce qui
   permet d'aligner en hauteur deux visuels placés côte à côte. */
.shot--cadre img {
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* Cadre du visuel : c'est lui qui rogne un éventuel zoom, pour que l'image
   agrandie ne déborde pas sur la légende. */
.shot-media { overflow: hidden; line-height: 0; }

/* `zoom` dans les données : resserre le cadrage sans changer la place occupée
   par le visuel dans la grille. */
.shot--zoom .shot-media img { transform: scale(var(--zoom, 1)); }
/* Séquence animée : la première frame porte la hauteur, les suivantes
   se superposent et s'enchaînent en fondu. */
.shot-anim { position: relative; line-height: 0; }
.shot-anim img + img {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.shot-anim img.is-on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .shot-anim img + img { display: none; }
}

.shot figcaption {
  font-size: 13px;
  font-weight: 300;
  color: var(--v2-fg-muted);
  padding: 12px 16px 14px;
  border-top: 1px solid var(--v2-line-soft);
}
/* Tablette : on repasse sur 6 colonnes, les portraits restent 2 par ligne. */
@media (max-width: 860px) {
  .gallery { grid-template-columns: repeat(6, 1fr); }
  .shot, .shot--third { grid-column: span 6; }
  .shot--narrow { grid-column: span 3; }
}

@media (max-width: 520px) {
  .gallery { grid-template-columns: 1fr; }
  .shot, .shot--narrow, .shot--third, .shot--full { grid-column: 1 / -1; }
}

/* ══ Visionneuse plein écran ═════════════════════════ */
.shot img, #detail-banner-img { cursor: zoom-in; }

.visionneuse {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  padding: 40px 32px 32px;
  background: rgba(8, 4, 22, 0.92);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: zoom-out;
  animation: visionneuse-entree 0.18s ease;
}
/* `display: flex` l'emporterait sur l'attribut `hidden` : on le rétablit. */
.visionneuse[hidden] { display: none; }
@keyframes visionneuse-entree { from { opacity: 0; } to { opacity: 1; } }

.visionneuse img {
  max-width: 100%;
  max-height: calc(100vh - 130px);
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
  cursor: default;
}

.visionneuse-legende {
  font-size: 14px;
  font-weight: 300;
  color: rgba(255, 255, 255, 0.75);
  text-align: center;
  max-width: 760px;
  margin: 0;
}

.visionneuse-fermer {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: #FFFFFF;
  cursor: pointer;
  transition: background 0.2s;
}
.visionneuse-fermer:hover { background: rgba(255, 255, 255, 0.18); }
.visionneuse-fermer:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .visionneuse { animation: none; }
}

@media (max-width: 600px) {
  .visionneuse { padding: 64px 16px 24px; }
  .visionneuse img { max-height: calc(100vh - 150px); }
}

.detail-footer-note {
  text-align: center;
  font-size: 14px;
  font-style: italic;
  color: var(--v2-fg-muted);
  margin-top: 48px;
  opacity: 0.8;
}

@media (max-width: 600px) {
  .detail-wrap { padding: 32px 18px 0; }
}

</style>
</head>
<body>

<div class="page detail-page">

  <header class="site-header">
    <nav class="v2-detail-nav" aria-label="Navigation principale">
      <a href="index.html#projets" class="v2-close-btn" aria-label="Close">
        <span class="material-icons-round">close</span>
      </a>

      <div class="v2-nav-right">
        <div class="lang-switch" aria-label="Language">
          <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          <div class="lang-sep" aria-hidden="true"></div>
          <button class="lang-btn active" data-lang="fr" aria-pressed="true">FR</button>
        </div>
        <div class="v2-theme-toggle" role="group" aria-label="Thème">
          <button class="v2-theme-btn" data-theme-btn="light" aria-label="Thème clair">
            <span class="material-icons-round" aria-hidden="true">light_mode</span>
          </button>
          <button class="v2-theme-btn active" data-theme-btn="dark" aria-label="Thème sombre">
            <span class="material-icons-round" aria-hidden="true">bedtime</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <div class="detail-banner">
    <img class="detail-banner-fond" id="detail-banner-fond" src="" alt="" aria-hidden="true">
    <img id="detail-banner-img" src="" alt="">
  </div>

  <div class="detail-wrap">
    <div id="detail-content"></div>
    <p class="detail-footer-note" data-en="Portfolio updated September 2026 — Confidential document" data-fr="Portfolio mis à jour en septembre 2026 — Document confidentiel">Portfolio mis à jour en septembre 2026 — Document confidentiel</p>
  </div>

</div>

<!-- Visionneuse : agrandissement d'un visuel au clic -->
<div class="visionneuse" id="visionneuse" role="dialog" aria-modal="true" hidden>
  <button class="visionneuse-fermer" id="visionneuse-fermer" type="button"
          data-label-en="Close" data-label-fr="Fermer" aria-label="Fermer">
    <span class="material-icons-round" aria-hidden="true">close</span>
  </button>
  <img id="visionneuse-img" src="" alt="">
  <p class="visionneuse-legende" id="visionneuse-legende"></p>
</div>

<script src="projets-data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let currentId = parseInt(new URLSearchParams(location.search).get('id'), 10) || 1;

  const BANNERS = {
    1: 'Sources/projets/transport luxe/banner - transport luxe.png',
    2: 'Sources/projets/aeronautique/banner - aeronautic&AI.png',
    3: 'Sources/projets/simulateur financier/banner - simulateur financier.png',
    4: 'Sources/projets/Design System/banner - design system.png',
  };

  // Bandeau : `banner` dans les données en priorité, sinon la bannière
  // dédiée historique, sinon le premier visuel du projet. null si aucun.
  function bannerFor(projet) {
    if (projet.banner) return projet.banner;
    if (BANNERS[projet.id]) return BANNERS[projet.id];
    return (projet.images && projet.images.length) ? projet.images[0].src : null;
  }

  // ── Langue ──────────────────────────────────────────────
  function applyLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.dataset[lang] || el.textContent;
    });
    // libellés portés par aria-label plutôt que par le texte
    document.querySelectorAll('[data-label-en]').forEach(el => {
      const v = el.dataset[`label${lang.charAt(0).toUpperCase()}${lang.slice(1)}`];
      if (v) el.setAttribute('aria-label', v);
    });
    document.querySelectorAll('.lang-btn').forEach(btn => {
      const active = btn.dataset.lang === lang;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));
    });
    sessionStorage.setItem('portfolio-lang', lang);
  }

  const savedLang = sessionStorage.getItem('portfolio-lang');
  let initialLang;
  if (savedLang) {
    initialLang = savedLang;
  } else {
    const langs = navigator.languages?.length ? navigator.languages : [navigator.language || 'fr'];
    initialLang = langs.some(l => l.toLowerCase().startsWith('fr')) ? 'fr' : 'en';
  }
  applyLang(initialLang);

  // ── Thème clair / sombre ──────────────────────────────────
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.v2-theme-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.themeBtn === theme);
    });
    localStorage.setItem('portfolio-theme', theme);
  }
  const savedTheme = localStorage.getItem('portfolio-theme');
  const systemPrefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme || (systemPrefersLight ? 'light' : 'dark'));
  document.querySelectorAll('.v2-theme-btn').forEach(btn =>
    btn.addEventListener('click', () => applyTheme(btn.dataset.themeBtn))
  );

  // ── Visionneuse ─────────────────────────────────────────
  // Clic sur n'importe quel visuel (bandeau ou galerie) : agrandissement
  // plein écran. Fermeture au clic sur le fond, sur la croix ou par Échap.
  const visionneuse = document.getElementById('visionneuse');
  const visionneuseImg = document.getElementById('visionneuse-img');
  const visionneuseLegende = document.getElementById('visionneuse-legende');
  let elementRendu = null;

  function ouvrirVisionneuse(img) {
    if (!visionneuse) return;
    // Dans une séquence animée, les frames se superposent : on prend celle
    // réellement visible, pas la dernière du DOM.
    const anim = img.closest('.shot-anim');
    if (anim) img = anim.querySelector('img.is-on') || anim.querySelector('img');
    if (!img || (!img.currentSrc && !img.src)) return;
    elementRendu = document.activeElement;
    visionneuseImg.src = img.currentSrc || img.src;
    visionneuseImg.alt = img.alt || '';
    const legende = img.closest('figure')?.querySelector('figcaption')?.textContent || img.alt || '';
    visionneuseLegende.textContent = legende;
    visionneuseLegende.hidden = !legende;
    visionneuse.hidden = false;
    document.body.style.overflow = 'hidden';
    document.getElementById('visionneuse-fermer').focus();
  }

  function fermerVisionneuse() {
    if (!visionneuse || visionneuse.hidden) return;
    visionneuse.hidden = true;
    visionneuseImg.src = '';
    document.body.style.overflow = '';
    if (elementRendu && elementRendu.focus) elementRendu.focus();
  }

  document.addEventListener('click', e => {
    const img = e.target.closest('.gallery img, #detail-banner-img');
    if (img) { ouvrirVisionneuse(img); return; }
    // clic sur le fond de la visionneuse (pas sur l'image elle-même)
    if (e.target === visionneuse || e.target.closest('.visionneuse-fermer')) fermerVisionneuse();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') fermerVisionneuse();
  });

  // Bascule le bandeau en mode « net » dès que le recadrage plein cadre
  // agrandirait trop l'image. Au-delà de 1,15× le flou devient visible.
  function ajusterBanniere() {
    const el = document.querySelector('.detail-banner');
    const img = document.getElementById('detail-banner-img');
    if (!el || !img || !img.naturalWidth) return;
    const boite = el.getBoundingClientRect();
    const couvrir = Math.max(boite.width / img.naturalWidth, boite.height / img.naturalHeight);
    el.classList.toggle('detail-banner--net', couvrir > 1.15);
  }
  window.addEventListener('resize', ajusterBanniere);

  // Déclaré avant le premier render() : demarrerAnimations() y accède.
  let animTimers = [];

  render(currentId);

  window.addEventListener('popstate', e => {
    navigate(e.state?.id || 1, false);
  });

  function navigate(id, animate = true) {
    currentId = id;
    const card = document.getElementById('detail-content');
    if (animate) {
      card.style.transition = 'opacity 0.14s ease';
      card.style.opacity = '0';
      setTimeout(() => {
        render(id);
        card.style.opacity = '1';
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, 140);
    } else {
      render(id);
    }
  }

  function render(id) {
    const projet = PROJETS.find(p => p.id === id);
    if (!projet) { location.href = 'index.html#projets'; return; }

    const lang = document.documentElement.lang || 'fr';
    const t = (lang === 'en' && projet.en) ? { ...projet, ...projet.en } : projet;

    document.title = `${projet.num} — ${t.titreCourt} · Charlotte Froidefond`;

    const bannerEl = document.querySelector('.detail-banner');
    const bannerImg = document.getElementById('detail-banner-img');
    const bannerFond = document.getElementById('detail-banner-fond');
    const bannerSrc = bannerFor(projet);
    if (bannerEl) bannerEl.hidden = !bannerSrc;
    if (bannerImg && bannerSrc) {
      bannerImg.src = bannerSrc;
      bannerImg.alt = t.titreCourt;
      if (bannerFond) bannerFond.src = bannerSrc;
      if (bannerImg.complete && bannerImg.naturalWidth) ajusterBanniere();
      else bannerImg.addEventListener('load', ajusterBanniere, { once: true });
    }

    const roleCourt = t.role.split(' (')[0];

    // Les projets n'ont pas tous le même niveau de détail : chaque bloc n'est
    // rendu que si les données correspondantes existent.
    const has = v => Array.isArray(v) ? v.length > 0 : Boolean(v);
    const section = (labelFr, labelEn, body) =>
      `<div class="detail-sep"></div>
       <div class="section-label" data-en="${labelEn}" data-fr="${labelFr}">${labelFr}</div>
       ${body}`;

    const demarche = (t.demarche || []).map(s =>
      `<li class="step-item"><span class="step-name">${s.titre}</span><span class="step-dot">·</span>— ${s.desc}</li>`
    ).join('');

    const objectifs = (t.objectifs || []).map(o => `<li>${o}</li>`).join('');

    const methodo = (t.methodo || []).map(m =>
      `<div class="methodo-card">
        <div class="methodo-titre">${m.titre}</div>
        <ul>${m.items.map(i => `<li>${i}</li>`).join('')}</ul>
      </div>`
    ).join('');

    const defis = (t.defis || []).map((d, i) =>
      `<div class="defi-card">
        <div class="defi-num" data-en="Challenge 0${i + 1}" data-fr="Défi 0${i + 1}">Défi 0${i + 1}</div>
        <div class="defi-titre">${d.titre}</div>
        <div class="defi-desc">${d.desc}</div>
        <div class="defi-sep"></div>
        <div class="defi-solution">
          <span class="defi-arrow">→</span>
          <span>${d.solution}</span>
        </div>
      </div>`
    ).join('');

    const kpis = (t.kpis || []).map(k =>
      `<div class="kpi-card">
        <div class="kpi-titre">${k.titre}</div>
        <div class="kpi-desc">${k.desc}</div>
      </div>`
    ).join('');

    // La galerie montre tous les visuels, y compris celui repris en bandeau :
    // le bandeau est recadré, la galerie le donne en entier.
    const galerie = (projet.images || [])
      .filter(img => img.src || (img.frames || []).length)
      .map(img => {
        // w/h natifs : le navigateur réserve la place avant le chargement
        // lazy, ce qui évite les sauts de mise en page au scroll.
        const dim = (img.w && img.h) ? ` width="${img.w}" height="${img.h}"` : '';
        const styles = [
          img.ratio ? `aspect-ratio:${img.ratio}` : '',
          img.zoom ? `--zoom:${img.zoom}` : '',
        ].filter(Boolean).join(';');
        const cadre = styles ? ` style="${styles}"` : '';

        // Légende bilingue : `altEn` complète `alt`. Les attributs data-*
        // permettent à applyLang() de la basculer sans re-rendre la galerie.
        const legendeFr = img.alt || '';
        const legendeEn = img.altEn || legendeFr;
        const legende = lang === 'en' ? legendeEn : legendeFr;

        const visuel = img.frames
          ? `<div class="shot-anim">${img.frames.map((f, i) =>
              `<img src="${f}" alt="${i === 0 ? legende : ''}"${i === 0 ? '' : ' aria-hidden="true"'}${dim} loading="lazy">`
            ).join('')}</div>`
          : `<div class="shot-media"><img src="${img.src}" alt="${legende}"${dim}${cadre} loading="lazy"></div>`;
        // `span` fixe la largeur du visuel dans la grille ; `type: 'full'`
        // reste accepté pour les projets écrits avant l'ajout de `span`.
        const span = img.span || (img.type === 'full' ? 'full' : '');
        return `<figure class="shot${span ? ` shot--${span}` : ''}${img.ratio ? ' shot--cadre' : ''}${img.zoom ? ' shot--zoom' : ''}">
          ${visuel}
          ${legende ? `<figcaption data-fr="${legendeFr}" data-en="${legendeEn}">${legende}</figcaption>` : ''}
        </figure>`;
      }).join('');

    const competences = (t.competences || []).map(c =>
      `<span class="tag">${c}</span>`
    ).join('');

    const metaCells = [
      ['Client', 'Client', t.clientCourt || projet.clientCourt],
      ['Année', 'Year', projet.annee],
      ['Rôle', 'Role', roleCourt],
      ['Équipe', 'Team', projet.equipe],
      ['Outils', 'Tools', (projet.outils || []).join(' · ')],
      ['Statut', 'Status', t.statut, true],
      ['Durée', 'Duration', t.dureeCourte],
    ].filter(c => has(c[2])).map(([fr, en, value, isStatut]) =>
      `<div class="meta-cell">
        <div class="meta-label" data-en="${en}" data-fr="${fr}">${fr}</div>
        <div class="meta-value${isStatut ? ' meta-statut' : ''}">${isStatut ? '<span class="statut-dot"></span>' : ''}${value}</div>
      </div>`
    ).join('');

    const detailEl = document.getElementById('detail-content');
    detailEl.innerHTML = `
      <h1 class="detail-titre">${t.titre}</h1>
      <p class="detail-sous-titre">${t.sousTitreCourt}</p>

      <div class="meta-block">${metaCells}</div>

      <div class="section-label" data-en="Context &amp; challenges" data-fr="Contexte &amp; enjeux">Contexte &amp; enjeux</div>
      <p class="section-text">${t.contexte}</p>

      ${has(objectifs) ? section('Objectifs', 'Objectives', `<ul class="objectifs-list">${objectifs}</ul>`) : ''}
      ${has(t.enjeux) ? section('Enjeux de conception', 'Design challenges', `<div class="enjeux-block">${t.enjeux}</div>`) : ''}
      ${has(demarche) ? section('Démarche UX/UI', 'UX/UI Approach', `<ul class="steps-list">${demarche}</ul>`) : ''}
      ${has(methodo) ? section('Méthodologie', 'Methodology', `<div class="methodo-grid">${methodo}</div>`) : ''}
      ${has(defis) ? section('Défis &amp; solutions', 'Challenges &amp; solutions', `<div class="defi-list">${defis}</div>`) : ''}
      ${has(kpis) ? section('Résultats &amp; KPIs', 'Results &amp; KPIs', `<div class="kpis-grid">${kpis}</div>`) : ''}
      ${has(galerie) ? section('Aperçu', 'Visuals', `<div class="gallery">${galerie}</div>`) : ''}
      ${has(competences) ? section('Compétences mobilisées', 'Skills involved', `<div class="competences-wrap">${competences}</div>`) : ''}
    `;
    applyLang(document.documentElement.lang || 'fr');
    demarrerAnimations();
  }

  // Enchaînement des séquences animées de la galerie. Les timers sont
  // remis à zéro à chaque rendu (changement de langue ou de projet).
  function demarrerAnimations() {
    animTimers.forEach(clearInterval);
    animTimers = [];
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.shot-anim').forEach(bloc => {
      const frames = Array.from(bloc.querySelectorAll('img'));
      if (frames.length < 2) return;
      let i = 0;
      animTimers.push(setInterval(() => {
        i = (i + 1) % frames.length;
        frames.forEach((f, n) => f.classList.toggle('is-on', n === i && n > 0));
      }, 1400));
    });
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => { applyLang(btn.dataset.lang); render(currentId); });
  });
});
</script>
