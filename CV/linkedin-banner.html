<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LinkedIn Banner — Charlotte Froidefond</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1584px;
  height: 396px;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  background: #13112B;
}

.banner {
  width: 1584px;
  height: 396px;
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
}

/* ── Fond dégradé ─── */
.bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 700px 500px at 110% 50%, rgba(123,58,237,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 400px 300px at -5%  80%, rgba(123,58,237,0.10) 0%, transparent 55%);
}

/* ── Déco SVG ─── */
.deco {
  position: absolute;
  right: 0;
  top: 0;
  width: 680px;
  height: 396px;
  pointer-events: none;
}

/* ── Contenu ─── */
.content {
  position: relative;
  z-index: 2;
  padding-left: 220px;
}

.name {
  font-size: 70px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1;
  letter-spacing: -1.5px;
  margin-bottom: 14px;
}

.title {
  font-size: 15px;
  font-weight: 500;
  color: #A370FF;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 22px;
}

.divider {
  width: 44px;
  height: 2.5px;
  background: linear-gradient(90deg, #7B3AED, #A370FF);
  border-radius: 2px;
  margin-bottom: 22px;
}

.sectors {
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
}

.sector {
  font-size: 12.5px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 4px;
  padding: 5px 13px;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

/* ── Hint d'export ─── */
.hint {
  position: absolute;
  bottom: 8px;
  right: 16px;
  font-size: 10px;
  color: rgba(255,255,255,0.15);
  font-family: monospace;
  z-index: 10;
}


</style>
</head>
<body>

<div class="banner">

  <div class="bg"></div>

  <!-- Décoration géométrique -->
  <svg class="deco" viewBox="0 0 680 396" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Cercles concentriques -->
    <circle cx="530" cy="198" r="280" stroke="rgba(123,58,237,0.09)" stroke-width="1"/>
    <circle cx="530" cy="198" r="210" stroke="rgba(123,58,237,0.11)" stroke-width="1"/>
    <circle cx="530" cy="198" r="140" stroke="rgba(123,58,237,0.16)" stroke-width="1.5"/>
    <circle cx="530" cy="198" r="72"  stroke="rgba(163,112,255,0.20)" stroke-width="1.5"/>
    <!-- Petit cercle accent haut-gauche de la déco -->
    <circle cx="210" cy="68"  r="54"  stroke="rgba(163,112,255,0.07)" stroke-width="1"/>
    <!-- Points flottants -->
    <circle cx="340" cy="52"  r="3"   fill="rgba(163,112,255,0.45)"/>
    <circle cx="368" cy="74"  r="2"   fill="rgba(163,112,255,0.30)"/>
    <circle cx="318" cy="80"  r="2"   fill="rgba(163,112,255,0.25)"/>
    <circle cx="390" cy="44"  r="1.5" fill="rgba(163,112,255,0.20)"/>
    <circle cx="295" cy="50"  r="1.5" fill="rgba(163,112,255,0.15)"/>
    <circle cx="420" cy="90"  r="2"   fill="rgba(163,112,255,0.20)"/>
    <!-- Ligne horizontale centrale -->
    <line x1="160" y1="198" x2="640" y2="198" stroke="rgba(123,58,237,0.08)" stroke-width="1"/>
    <!-- Arc bas -->
    <circle cx="60"  cy="360" r="90"  stroke="rgba(123,58,237,0.07)" stroke-width="1"/>
  </svg>

  <!-- Contenu principal -->
  <div class="content">
    <div class="name">Charlotte Froidefond</div>
    <div class="title">Product Designer</div>
    <div class="divider"></div>
    <div class="sectors">
      <span class="sector">Finance</span>
      <span class="sector">Immobilier</span>
      <span class="sector">Transport</span>
      <span class="sector">Assurance</span>
      <span class="sector">IA</span>
      <span class="sector">Retail</span>
      <span class="sector">Santé</span>
    </div>
  </div>

  <div class="hint">1584 × 396 px — LinkedIn Banner</div>


</div>

</body>
</html>
