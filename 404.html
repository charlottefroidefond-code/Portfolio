<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlotte Froidefond — Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

/* ══════════════════════════════════════════════════════════
   V2 — Design tokens (identiques à index.html)
   ══════════════════════════════════════════════════════════ */
:root {
  --v2-bg:              #1C0E3F;
  --v2-card:             rgba(15, 20, 42, 0.82);
  --v2-tint:             rgba(99, 1, 199, 0.22);
  --v2-line:             rgba(255, 255, 255, 0.12);
  --v2-line-soft:        rgba(255, 255, 255, 0.08);
  --v2-fg:               #FFFFFF;
  --v2-fg-soft:          #EDEDED;
  --v2-fg-muted:         rgba(255, 255, 255, 0.68);
  --v2-accent:           #A370FF;
  --v2-title:            #DBB7FF;
  --v2-ring:             rgba(255, 255, 255, 0.07);
  --v2-glow:             rgba(163, 112, 255, 0.38);
  --v2-input-bg:         rgba(255, 255, 255, 0.06);
  --v2-input-border:     rgba(255, 255, 255, 0.15);
  --v2-shadow:           rgba(0, 0, 0, 0.20);
}

html[data-theme="light"] {
  --v2-bg:              #F6F3FC;
  --v2-card:             #FFFFFF;
  --v2-tint:             rgba(123, 58, 237, 0.06);
  --v2-line:             rgba(28, 14, 63, 0.10);
  --v2-line-soft:        rgba(28, 14, 63, 0.08);
  --v2-fg:               #1C0E3F;
  --v2-fg-soft:          rgba(28, 14, 63, 0.72);
  --v2-fg-muted:         rgba(28, 14, 63, 0.55);
  --v2-accent:           #7B3AED;
  --v2-title:            #7B3AED;
  --v2-ring:             rgba(123, 58, 237, 0.14);
  --v2-glow:             rgba(163, 112, 255, 0.30);
  --v2-input-bg:         rgba(28, 14, 63, 0.04);
  --v2-input-border:     rgba(28, 14, 63, 0.14);
  --v2-shadow:           rgba(60, 20, 120, 0.10);
}

* { box-sizing: border-box; }

body {
  background: var(--v2-bg);
  color: var(--v2-fg);
  transition: background 0.4s ease, color 0.4s ease;
  font-family: 'DM Sans', sans-serif;
}

.bg-layer { display: none; }

/* ══ Décor — identique à l'accueil ═══════════════════════ */
.v2-decor {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.v2-decor-glow {
  position: absolute;
  left: -280px;
  top: -160px;
  width: 760px;
  height: 760px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--v2-glow) 0%, rgba(163,112,255,0.08) 45%, transparent 72%);
  filter: blur(10px);
}
.v2-decor-rings {
  position: absolute;
  left: -220px;
  top: -120px;
  width: 900px;
  height: 900px;
}
.v2-decor-rings span {
  position: absolute;
  inset: 0;
  margin: auto;
  border: 1px solid var(--v2-ring);
  border-radius: 50%;
}
.v2-decor-rings span:nth-child(1) { width: 900px; height: 900px; }
.v2-decor-rings span:nth-child(2) { width: 680px; height: 680px; }
.v2-decor-rings span:nth-child(3) { width: 460px; height: 460px; }
.v2-decor-rings span:nth-child(4) { width: 240px; height: 240px; }

/* ══ Navigation (identique à l'accueil) ══════════════════ */
.v2-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--v2-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--v2-line);
}

.v2-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(20px, 4vw, 56px);
  padding: 22px clamp(20px, 4vw, 64px);
  position: relative;
}
.v2-nav--simple { justify-content: flex-end; }
.v2-nav--simple .v2-nav-right { position: static; }

.v2-nav-right {
  display: flex;
  align-items: center;
  gap: 22px;
  position: absolute;
  right: clamp(20px, 4vw, 64px);
}
.v2-nav-right .lang-btn { color: var(--v2-fg-muted); }
.v2-nav-right .lang-btn.active { color: var(--v2-accent); }
.v2-nav-right .lang-btn:hover { color: var(--v2-fg); }
.v2-nav-right .lang-sep { background: var(--v2-line); }

.v2-theme-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--v2-input-bg);
  border-radius: 999px;
  padding: 5px;
}
.v2-theme-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid transparent;
  background: transparent;
  color: var(--v2-fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.v2-theme-btn .material-icons-round { font-size: 16px; }
.v2-theme-btn:hover { color: var(--v2-fg); }
.v2-theme-btn.active {
  border-color: var(--v2-accent);
  color: var(--v2-fg);
  background: var(--v2-card);
  box-shadow: inset 0 4px 16px rgba(123,58,237,0.20);
}

/* ══ Contenu 404 ══════════════════════════════════════════ */
.v2-notfound {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 84px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
}

/* Icône animée */
.v2-notfound-anim {
  position: relative;
  width: 90px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 32px;
}
.v2-notfound-anim::before,
.v2-notfound-anim::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(163, 112, 255, 0.45);
  animation: v2-ring-expand 2.4s ease-out infinite;
}
.v2-notfound-anim::after { animation-delay: 1.2s; }

.v2-notfound-anim-circle {
  position: relative;
  z-index: 1;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--v2-tint);
  border: 1.5px solid rgba(163, 112, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
}

.v2-notfound-icon {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  animation: v2-icon-cycle 8s ease-in-out infinite;
}
.v2-notfound-icon .material-icons-round { font-size: 30px; color: var(--v2-accent); }
.v2-notfound-icon:nth-child(1) { animation-delay: 0s; }
.v2-notfound-icon:nth-child(2) { animation-delay: 2s; }
.v2-notfound-icon:nth-child(3) { animation-delay: 4s; }
.v2-notfound-icon:nth-child(4) { animation-delay: 6s; }

.v2-notfound-icon--dots { gap: 5px; }
.v2-notfound-icon--dots .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--v2-accent);
  animation: v2-dot-bounce 1s ease-in-out infinite;
}
.v2-notfound-icon--dots .dot:nth-child(1) { animation-delay: 0s; }
.v2-notfound-icon--dots .dot:nth-child(2) { animation-delay: 0.18s; }
.v2-notfound-icon--dots .dot:nth-child(3) { animation-delay: 0.36s; }

@keyframes v2-icon-cycle {
  0%   { opacity: 0; transform: scale(0.65) translateY(8px);  }
  5%   { opacity: 1; transform: scale(1)    translateY(0);    }
  20%  { opacity: 1; transform: scale(1)    translateY(0);    }
  25%  { opacity: 0; transform: scale(0.65) translateY(-8px); }
  100% { opacity: 0; }
}
@keyframes v2-ring-expand {
  0%   { transform: scale(1);   opacity: 0.55; }
  100% { transform: scale(1.9); opacity: 0;    }
}
@keyframes v2-dot-bounce {
  0%, 60%, 100% { transform: translateY(0);    }
  30%            { transform: translateY(-7px); }
}

@media (prefers-reduced-motion: reduce) {
  .v2-notfound-anim::before, .v2-notfound-anim::after { animation: none; opacity: 0; }
  .v2-notfound-icon { animation: none; opacity: 0; }
  .v2-notfound-icon:first-child { opacity: 1; transform: none; }
  .v2-notfound-icon--dots .dot { animation: none; }
}

.v2-notfound-title {
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: clamp(24px, 3.4vw, 36px);
  color: var(--v2-fg);
  margin-bottom: 14px;
}

.v2-notfound-text {
  font-size: 16px;
  font-weight: 300;
  color: var(--v2-fg-soft);
  line-height: 1.7;
  max-width: 440px;
  margin: 0 auto 40px;
}

.v2-notfound-contact {
  font-size: 15px;
  font-weight: 300;
  color: var(--v2-fg-muted);
}
.v2-notfound-contact a {
  color: var(--v2-accent);
  text-decoration: none;
  font-weight: 500;
}
.v2-notfound-contact a:hover { text-decoration: underline; }

</style>
</head>
<body>

<div class="v2-decor" aria-hidden="true">
  <div class="v2-decor-glow"></div>
  <div class="v2-decor-rings">
    <span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="page">

  <header class="v2-header">
    <nav class="v2-nav v2-nav--simple" aria-label="Navigation principale">
      <div class="v2-nav-right">
        <div class="lang-switch" aria-label="Language">
          <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          <div class="lang-sep" aria-hidden="true"></div>
          <button class="lang-btn active" data-lang="fr" aria-pressed="true">FR</button>
        </div>
        <div class="v2-theme-toggle" role="group" aria-label="Thème">
          <button class="v2-theme-btn" data-theme-btn="light" aria-label="Thème clair">
            <span class="material-icons-round" aria-hidden="true">light_mode</span>
          </button>
          <button class="v2-theme-btn active" data-theme-btn="dark" aria-label="Thème sombre">
            <span class="material-icons-round" aria-hidden="true">bedtime</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="v2-notfound">
    <div>
      <div class="v2-notfound-anim" aria-hidden="true">
        <div class="v2-notfound-anim-circle">
          <span class="v2-notfound-icon"><span class="material-icons-round">construction</span></span>
          <span class="v2-notfound-icon"><span class="material-icons-round">draw</span></span>
          <span class="v2-notfound-icon"><span class="material-icons-round">desktop_mac</span></span>
          <span class="v2-notfound-icon v2-notfound-icon--dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </span>
        </div>
      </div>

      <h1 class="v2-notfound-title" data-en="Under maintenance" data-fr="En maintenance">En maintenance</h1>
      <p class="v2-notfound-text"
         data-en="My portfolio is currently being updated. It'll be back very soon — thank you for your patience!"
         data-fr="Mon portfolio est en cours de mise à jour. Il sera de retour très vite — merci pour votre patience !">
        Mon portfolio est en cours de mise à jour. Il sera de retour très vite — merci pour votre patience !
      </p>

      <p class="v2-notfound-contact">
        <span data-en="Want to get in touch? Email me at" data-fr="Vous souhaitez me contacter ? Écrivez-moi à">Vous souhaitez me contacter ? Écrivez-moi à</span>
        <a href="mailto:charlotte.froidefond@gmail.com">charlotte.froidefond@gmail.com</a>
      </p>
    </div>
  </main>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

  // ── Langue ──────────────────────────────────────────────
  function applyLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.dataset[lang] || el.textContent;
    });
    document.querySelectorAll('.lang-btn').forEach(btn => {
      const active = btn.dataset.lang === lang;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));
    });
    sessionStorage.setItem('portfolio-lang', lang);
  }

  const savedLang = sessionStorage.getItem('portfolio-lang');
  let initialLang;
  if (savedLang) {
    initialLang = savedLang;
  } else {
    const langs = navigator.languages?.length ? navigator.languages : [navigator.language || 'fr'];
    initialLang = langs.some(l => l.toLowerCase().startsWith('fr')) ? 'fr' : 'en';
  }
  applyLang(initialLang);
  document.querySelectorAll('.lang-btn').forEach(btn =>
    btn.addEventListener('click', () => applyLang(btn.dataset.lang))
  );

  // ── Thème clair / sombre ──────────────────────────────────
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.v2-theme-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.themeBtn === theme);
    });
    localStorage.setItem('portfolio-theme', theme);
  }
  const savedTheme = localStorage.getItem('portfolio-theme');
  const systemPrefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme || (systemPrefersLight ? 'light' : 'dark'));
  document.querySelectorAll('.v2-theme-btn').forEach(btn =>
    btn.addEventListener('click', () => applyTheme(btn.dataset.themeBtn))
  );

});
</script>

<!-- Vercel Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
